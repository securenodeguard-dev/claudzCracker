<header class="site-header">
  <div class="container bar">
    <a routerLink="/" class="brand" aria-label="Go to home page">
      <img [src]="resolveLogoUrl(settings?.logoUrl || '/assets/logo.jpg')" alt="{{ settings?.businessName || 'Cracker Shop' }} logo" class="logo" />
      <span>{{ settings?.businessName || 'Cracker Shop' }}</span>
    </a>

    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" /></svg>
    </button>

    <nav [class.open]="menuOpen" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-7H9v7H5a1 1 0 0 1-1-1z" /></svg>
        <span>Home</span>
      </a>
      <a routerLink="/about" routerLinkActive="active" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm0 4.5v5m0 4.5h.01" /></svg>
        <span>About</span>
      </a>
      <a routerLink="/products" routerLinkActive="active" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8.5h12l-1.2 9.1a2 2 0 0 1-2 1.7H9.2a2 2 0 0 1-2-1.7L6 8.5zm2.5-1.5A3.5 3.5 0 0 1 12 3.5a3.5 3.5 0 0 1 3.5 3.5" /></svg>
        <span>Products</span>
      </a>
      <a routerLink="/products" [queryParams]="{ offer: true }" routerLinkActive="active" class="nav-link offer-link"><span>✦ Offers</span></a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.1 6-10A6 6 0 1 0 6 11c0 4.9 6 10 6 10zm0-8.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" /></svg>
        <span>Contact</span>
      </a>
      <a routerLink="/cart" routerLinkActive="active" class="nav-link cart-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5H6l1.3 8.2A2 2 0 0 0 9.3 15h7.4a2 2 0 0 0 2-1.7L19.5 7H7.2m3.3 12.3a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm7.1 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z" /></svg>
        <span>Cart</span>
      </a>
      <a *ngIf="settings?.phone" [href]="'tel:' + settings?.phone" class="btn call-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 4.8c.7-.7 1.7-.6 2.3.2l.7 1.3a1.6 1.6 0 0 1-.3 1.9l-1.3 1.3c.8 1.8 2.4 3.3 4.1 4.1l1.3-1.3a1.7 1.7 0 0 1 1.9-.3l1.3.7c.8.6.9 1.6.2 2.3l-1.2 1.2c-.8.7-1.9 1-3 .7a14.1 14.1 0 0 1-6.7-6.7c-.2-1.1.1-2.2.7-3l1.2-1.2z" /></svg>
        <span>Call Now</span>
      </a>
    </nav>
  </div>
</header>
